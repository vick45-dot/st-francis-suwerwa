<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content manager &mdash; St. Francis Girls' High School</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/img/favicon.png" type="image/png">

<!-- The school's typefaces, the same two used across the website -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<!-- School colours and typefaces for the content manager -->
<link rel="stylesheet" href="admin-theme.css">

<style>
  /* Loading screen shown while the content manager starts up */
  body{ margin:0; background:#F6F4EF; color:#4A5160;
        font-family:"Public Sans",-apple-system,"Segoe UI",Roboto,sans-serif; }
  .boot{ position:fixed; inset:0; display:flex; align-items:center;
         justify-content:center; flex-direction:column; gap:1.2rem;
         background:#F6F4EF; text-align:center; padding:2rem; z-index:9999; }
  .boot img{ height:120px; }
  .boot__name{ font-family:"Fraunces",Georgia,serif; font-weight:400;
               font-size:1.3rem; color:#0A1B4D; }
  .boot__sub{ font-size:.7rem; letter-spacing:.2em; text-transform:uppercase;
              color:#C9922A; margin-top:.3rem; }
  .boot__bar{ width:160px; height:3px; background:#DCD8CE; border-radius:3px;
              overflow:hidden; margin-top:.4rem; }
  .boot__bar i{ display:block; width:40%; height:100%; background:#123499;
                border-radius:3px; animation:slide 1.1s ease-in-out infinite; }
  @keyframes slide{ 0%{ transform:translateX(-100%);} 100%{ transform:translateX(300%);} }
  .boot small{ color:#7A8194; max-width:44ch; line-height:1.6; }
  .boot a{ color:#123499; }
</style>
</head>
<body>

<script>
  /* Opened by double-clicking on a computer (file://)? The content manager
     needs the live site, so send the user to the offline dashboard instead. */
  if (location.protocol === 'file:') {
    location.replace('../dashboard/index.html');
  }
</script>

<div class="boot" id="boot">
  <img src="../assets/img/crest.png" alt="">
  <div>
    <div class="boot__name">St. Francis Girls&rsquo; High School</div>
    <div class="boot__sub">Content manager</div>
  </div>
  <div class="boot__bar"><i></i></div>
  <small>Preparing the content manager&hellip;</small>
</div>

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="https://unpkg.com/decap-cms@^3.3.0/dist/decap-cms.js"></script>
<script>
  window.addEventListener('load', function () {
    var b = document.getElementById('boot');
    if (b) setTimeout(function () { b.remove(); }, 1400);

    /* Give the preview panel the school's typefaces too */
    if (window.CMS && window.CMS.registerPreviewStyle) {
      window.CMS.registerPreviewStyle('/admin/preview.css');
    }

    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', function (user) {
        if (!user) {
          window.netlifyIdentity.on('login', function () { document.location.href = '/admin/'; });
        }
      });
    }
  });
</script>
</body>
</html>
