backend:
  name: git-gateway
  branch: main

# Lets the content manager run on your own machine for testing,
# alongside `npx decap-server`. Ignored once the site is live on Netlify.
local_backend: true

media_folder: "assets/img/uploads"
public_folder: "assets/img/uploads"

logo_url: /assets/img/crest.png
publish_mode: simple

collections:

  # ---------------------------------------------------------------
  - name: "essentials"
    label: "Start here"
    files:

      - label: "School contact details"
        name: "site"
        file: "data/site.json"
        description: "Telephone, email, WhatsApp and address. These appear across the whole website."
        fields:
          - { label: "Telephone number", name: "phone", widget: "string", required: false, hint: "For example 0712 345 678" }
          - { label: "Second telephone (optional)", name: "phone2", widget: "string", required: false }
          - { label: "WhatsApp number", name: "whatsapp", widget: "string", required: false, hint: "Full international form, for example 254712345678" }
          - { label: "Email address", name: "email", widget: "string", required: false }
          - { label: "Postal address", name: "postal", widget: "string", required: false, hint: "For example P.O. Box 000-30200, Kitale" }
          - { label: "Location description", name: "location", widget: "string", required: false }
          - { label: "Google Maps link", name: "mapEmbed", widget: "string", required: false, hint: "Open the school's pin in Google Maps, press Share, paste the link here" }
          - { label: "Facebook page", name: "facebook", widget: "string", required: false }
          - { label: "Instagram page", name: "instagram", widget: "string", required: false }
          - { label: "YouTube channel", name: "youtube", widget: "string", required: false }
          - { label: "Homepage headline", name: "heroHeading", widget: "string", required: false }
          - { label: "Homepage introduction", name: "heroText", widget: "text", required: false }
          - { label: "Current enrolment", name: "enrolment", widget: "string", required: false }
          - { label: "Number of streams", name: "streams", widget: "string", required: false }
          - { label: "Number of teachers", name: "teachers", widget: "string", required: false }
          - { label: "University placements", name: "placements", widget: "string", required: false }

      - label: "Principal's message"
        name: "principal"
        file: "data/principal.json"
        description: "The welcome message and portrait shown on the homepage."
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Title", name: "title", widget: "string", default: "Principal" }
          - { label: "Portrait photograph", name: "photo", widget: "image", required: false }
          - { label: "Message", name: "message", widget: "text", required: false, hint: "Two or three paragraphs welcoming visitors to the school" }

  # ---------------------------------------------------------------
  - name: "news"
    label: "News & events"
    files:
      - label: "News items"
        name: "news"
        file: "data/news.json"
        description: "Announcements, term dates and events. The three most recent appear on the homepage."
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD MMM YYYY", time_format: false }
              - { label: "Photograph", name: "image", widget: "image", required: false }
              - { label: "Text", name: "body", widget: "text" }

  # ---------------------------------------------------------------
  - name: "pages"
    label: "Page content"
    files:

      - label: "Admissions"
        name: "admissions"
        file: "data/admissions.json"
        fields:
          - { label: "Introduction", name: "intro", widget: "text", required: false }
          - label: "Senior school pathways offered"
            name: "pathways"
            widget: "list"
            required: false
            summary: "{{fields.name}}"
            hint: "Schools may offer a maximum of two subject combinations"
            fields:
              - { label: "Pathway", name: "name", widget: "select", options: ["STEM", "Social Sciences", "Arts and Sports Science"] }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Subject combinations", name: "combinations", widget: "string", required: false }
          - label: "Grade 10 requirements"
            name: "requirements"
            widget: "list"
            required: false
            summary: "{{fields.item}}"
            fields:
              - { label: "Item", name: "item", widget: "string" }
          - label: "Documents to bring"
            name: "documents"
            widget: "list"
            required: false
            summary: "{{fields.doc}}"
            fields:
              - { label: "Document", name: "doc", widget: "string" }
          - { label: "Reporting dates", name: "reportingDates", widget: "text", required: false }
          - label: "Fee structure"
            name: "fees"
            widget: "list"
            required: false
            summary: "{{fields.item}} — KES {{fields.amount}}"
            fields:
              - { label: "Item", name: "item", widget: "string" }
              - { label: "Grade or form", name: "form", widget: "string", required: false }
              - { label: "Amount per term (KES)", name: "amount", widget: "string" }
          - { label: "Note under the fee table", name: "feesNote", widget: "text", required: false }

      - label: "Academics"
        name: "academics"
        file: "data/academics.json"
        fields:
          - { label: "Introduction", name: "intro", widget: "text", required: false }
          - label: "Departments"
            name: "departments"
            widget: "list"
            required: false
            summary: "{{fields.name}}"
            fields:
              - { label: "Department", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "text", required: false }
          - label: "Subjects offered"
            name: "subjects"
            widget: "list"
            required: false
            summary: "{{fields.subject}}"
            fields:
              - { label: "Subject", name: "subject", widget: "string" }

      - label: "Student life"
        name: "life"
        file: "data/life.json"
        fields:
          - { label: "Boarding and welfare", name: "boarding", widget: "text", required: false }
          - { label: "Chaplaincy and guidance", name: "pastoral", widget: "text", required: false }
          - label: "Clubs and societies"
            name: "clubs"
            widget: "list"
            required: false
            summary: "{{fields.name}}"
            fields:
              - { label: "Club", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "text", required: false }
          - label: "Games and sports"
            name: "sports"
            widget: "list"
            required: false
            summary: "{{fields.sport}}"
            fields:
              - { label: "Sport", name: "sport", widget: "string" }
          - label: "Achievements"
            name: "achievements"
            widget: "list"
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: "Achievement", name: "title", widget: "string" }
              - { label: "Year", name: "year", widget: "string", required: false }
              - { label: "Level", name: "level", widget: "select", required: false, options: ["Zonal", "Sub-county", "County", "Regional", "National"] }

      - label: "About the school"
        name: "about"
        file: "data/about.json"
        fields:
          - { label: "History", name: "history", widget: "text", required: false }
          - { label: "Sponsorship", name: "sponsorship", widget: "text", required: false }
          - { label: "Term calendar", name: "calendar", widget: "text", required: false }

  # ---------------------------------------------------------------
  - name: "records"
    label: "School records"
    files:

      - label: "K.C.S.E. results"
        name: "kcse"
        file: "data/kcse.json"
        description: "K.C.S.E. record. One entry per year. Leave a grade blank where there were none. The mean is rounded to the nearest grade point, matching the school's own board."
        fields:
          - label: "Years"
            name: "years"
            widget: "list"
            summary: "{{fields.year}} — mean {{fields.mean}} ({{fields.meanGrade}})"
            fields:
              - { label: "Year", name: "year", widget: "number", value_type: "int" }
              - { label: "Candidates entered", name: "entry", widget: "number", value_type: "int" }
              - label: "Grade distribution"
                name: "grades"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "A",  name: "A",  widget: "number", required: false, value_type: "int" }
                  - { label: "A-", name: "A-", widget: "number", required: false, value_type: "int" }
                  - { label: "B+", name: "B+", widget: "number", required: false, value_type: "int" }
                  - { label: "B",  name: "B",  widget: "number", required: false, value_type: "int" }
                  - { label: "B-", name: "B-", widget: "number", required: false, value_type: "int" }
                  - { label: "C+", name: "C+", widget: "number", required: false, value_type: "int" }
                  - { label: "C",  name: "C",  widget: "number", required: false, value_type: "int" }
                  - { label: "C-", name: "C-", widget: "number", required: false, value_type: "int" }
                  - { label: "D+", name: "D+", widget: "number", required: false, value_type: "int" }
                  - { label: "D",  name: "D",  widget: "number", required: false, value_type: "int" }
                  - { label: "D-", name: "D-", widget: "number", required: false, value_type: "int" }
                  - { label: "E",  name: "E",  widget: "number", required: false, value_type: "int" }
              - { label: "Mean score", name: "mean", widget: "number", value_type: "float" }
              - { label: "Mean grade", name: "meanGrade", widget: "string" }

      - label: "Leadership"
        name: "leadership"
        file: "data/leadership.json"
        fields:
          - label: "Principals"
            name: "principals"
            widget: "list"
            summary: "{{fields.name}} ({{fields.years}})"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Years of service", name: "years", widget: "string", hint: "For example 2024 – present" }
          - label: "Board of Management Chairpersons"
            name: "bom"
            widget: "list"
            summary: "{{fields.name}} ({{fields.years}})"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Years of service", name: "years", widget: "string" }

  # ---------------------------------------------------------------
  - name: "media"
    label: "Photographs & voices"
    files:

      - label: "Gallery"
        name: "gallery"
        file: "data/gallery.json"
        description: "Photographs shown on the gallery page."
        fields:
          - label: "Photographs"
            name: "items"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - { label: "Photograph", name: "image", widget: "image" }
              - { label: "Caption", name: "caption", widget: "string", required: false }

      - label: "Student & old girl voices"
        name: "voices"
        file: "data/voices.json"
        description: "Short quotations shown on the homepage."
        fields:
          - label: "Quotations"
            name: "items"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Quotation", name: "quote", widget: "text" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role or year", name: "role", widget: "string", required: false, hint: "For example Form Four, 2026 or Class of 2019" }
